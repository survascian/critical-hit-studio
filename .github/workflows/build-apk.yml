name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'public/mobile.*'
      - 'public/cloud.js'
      - 'public/plan.js'
      - 'public/platforms.js'
      - 'public/genres.js'
      - 'public/awards.js'
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        working-directory: mobile-app
        run: npm install

      - name: Prepare mobile web assets
        working-directory: mobile-app
        run: npm run prepare-www

      - name: Generate and sync Android project
        working-directory: mobile-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Critical Hit Studio app icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="mobile-app/android/app/src/main/res/mipmap-$density"
            if [ -d "$dir" ]; then
              cp build/icon.png "$dir/ic_launcher.png"
              cp build/icon.png "$dir/ic_launcher_round.png"
              cp build/icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk Critical-Hit-Studio-Mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Critical-Hit-Studio-Mobile-APK
          path: Critical-Hit-Studio-Mobile.apk
          retention-days: 30
